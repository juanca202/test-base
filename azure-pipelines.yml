trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  CI: 'true'
  # Historial de Allure persistido entre ejecuciones (tendencias y detección de tests flaky)
  ALLURE_HISTORY_DIR: $(Pipeline.Workspace)/.allure-history

steps:
  - task: NodeTool@0
    displayName: Instalar Node.js
    inputs:
      versionSpec: '22.x'

  - task: Cache@2
    displayName: Restaurar historial de Allure
    inputs:
      # La clave es única por ejecución para que siempre se guarde el historial actualizado;
      # restoreKeys recupera el de la ejecución anterior.
      key: 'allure-history | "$(Agent.OS)" | $(Build.BuildId)'
      restoreKeys: |
        allure-history | "$(Agent.OS)"
      path: $(ALLURE_HISTORY_DIR)

  - script: |
      mkdir -p .allure
      if [ -f "$(ALLURE_HISTORY_DIR)/history.jsonl" ]; then
        cp "$(ALLURE_HISTORY_DIR)/history.jsonl" .allure/history.jsonl
      fi
    displayName: Cargar historial en .allure/

  - script: npm ci
    displayName: Instalar dependencias

  - script: npx playwright install --with-deps
    displayName: Instalar browsers

  - script: npm run quality:check
    displayName: Lint, formato y build

  # continueOnError mantiene el job vivo ante pruebas en rojo para que se publiquen
  # reportes y evidencias y se guarde el historial; el job falla en el último paso.
  - script: npm test
    displayName: Ejecutar pruebas (Playwright + Allure)
    continueOnError: true
    env:
      BASE_URL: $(BASE_URL)
      API_BASE_URL: $(API_BASE_URL)

  - script: |
      mkdir -p "$(ALLURE_HISTORY_DIR)"
      cp .allure/history.jsonl "$(ALLURE_HISTORY_DIR)/history.jsonl"
    displayName: Guardar historial de Allure
    condition: always()

  # Resultados en formato legible por máquina (CR-011) para Test Plans de Azure DevOps
  - task: PublishTestResults@2
    displayName: Publicar resultados JUnit
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: test-results/junit.xml
      mergeTestResults: true
      testRunTitle: Playwright - Build $(Build.BuildNumber)

  - task: PublishPipelineArtifact@1
    displayName: Publicar reporte de Allure
    condition: always()
    inputs:
      targetPath: allure-report
      artifact: allure-report
      publishLocation: pipeline

  # Evidencias: traces, screenshots y videos (ADR-007)
  - task: PublishPipelineArtifact@1
    displayName: Publicar evidencias de ejecución
    condition: always()
    inputs:
      targetPath: test-results
      artifact: evidencias-$(System.JobAttempt)
      publishLocation: pipeline

  - script: |
      echo "##vso[task.logissue type=error]Hay pruebas fallidas"
      exit 1
    displayName: Fallar si hubo pruebas en rojo
    condition: eq(variables['Agent.JobStatus'], 'SucceededWithIssues')
