<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="800" fill="#ffffff"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1280" height="70" fill="#e6e6e6"/>
  <text x="30" y="30" font-size="11" fill="#999999">Rendimiento del proceso &gt; CP01 — Calificación de Proveedores</text>
  <text x="30" y="52" font-size="18" fill="#333333">CP01 — Calificación de Proveedores</text>

  <!-- Tabs -->
  <text x="30" y="95" font-size="13" fill="#333333">Visión general</text>
  <rect x="30" y="100" width="90" height="3" fill="#666666"/>
  <text x="140" y="95" font-size="13" fill="#999999">Diagrama</text>

  <!-- Left: stats -->
  <rect x="30" y="120" width="700" height="560" rx="4" fill="#f5f5f5" stroke="#dddddd"/>
  <text x="45" y="145" font-size="13" fill="#333333">Estadísticas rápidas</text>
  <text x="45" y="185" font-size="22" fill="#333333">12</text>
  <text x="45" y="205" font-size="10" fill="#999999">Instancias en curso</text>
  <text x="200" y="185" font-size="22" fill="#333333">2h 30m</text>
  <text x="200" y="205" font-size="10" fill="#999999">Promedio de duración</text>

  <text x="45" y="250" font-size="13" fill="#333333">Tasa de renovación (gráfico de líneas)</text>
  <rect x="45" y="265" width="650" height="180" fill="#ffffff" stroke="#cccccc"/>
  <polyline points="60,400 150,380 240,410 330,360 420,390 510,350 600,370 680,340" fill="none" stroke="#999999" stroke-width="2"/>

  <text x="45" y="480" font-size="13" fill="#333333">Duración media (gráfico de barras)</text>
  <rect x="45" y="495" width="650" height="150" fill="#ffffff" stroke="#cccccc"/>
  <rect x="70" y="560" width="30" height="60" fill="#cccccc"/>
  <rect x="120" y="540" width="30" height="80" fill="#cccccc"/>
  <rect x="170" y="580" width="30" height="40" fill="#cccccc"/>

  <!-- Right: instancias en curso -->
  <rect x="750" y="120" width="500" height="560" rx="4" fill="#f5f5f5" stroke="#dddddd"/>
  <text x="765" y="145" font-size="13" fill="#333333">Instancias en curso</text>
  <text x="765" y="170" font-size="11" fill="#999999">Mostrando 0 de 0 resultados (ejemplo)</text>
</svg>
