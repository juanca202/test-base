<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="800" fill="#ffffff"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="800" fill="#4d4d4d"/>
  <text x="20" y="40" font-size="14" fill="#ffffff">Usuario autenticado</text>
  <rect x="0" y="70" width="220" height="1" fill="#666666"/>
  <text x="20" y="110" font-size="14" fill="#ffffff">Iniciar</text>
  <rect x="0" y="95" width="220" height="34" fill="#666666"/>
  <text x="20" y="110" font-size="14" fill="#ffffff">Iniciar</text>
  <text x="20" y="160" font-size="14" fill="#cccccc">Mis tareas</text>
  <text x="20" y="200" font-size="14" fill="#cccccc">Procesos</text>
  <text x="20" y="240" font-size="14" fill="#cccccc">Rendimiento del proceso</text>
  <text x="20" y="280" font-size="14" fill="#cccccc">Rendimiento del equipo</text>

  <!-- Top bar -->
  <rect x="220" y="0" width="1060" height="70" fill="#e6e6e6"/>
  <text x="250" y="42" font-size="20" fill="#333333">Iniciar un proceso</text>

  <!-- Search -->
  <rect x="250" y="90" width="500" height="36" rx="4" fill="#f5f5f5" stroke="#bbbbbb"/>
  <text x="262" y="113" font-size="12" fill="#999999">Campo: Buscar proceso a iniciar...</text>

  <!-- Cards grid: process apps -->
  <g>
    <rect x="250" y="150" width="230" height="120" rx="6" fill="#f5f5f5" stroke="#cccccc"/>
    <rect x="266" y="166" width="28" height="28" fill="#d9d9d9"/>
    <text x="304" y="185" font-size="13" fill="#333333">Apertura de Cuentas</text>
    <text x="266" y="230" font-size="11" fill="#999999">Tarjeta: proceso iniciable</text>
    <rect x="266" y="242" width="90" height="24" rx="3" fill="#999999"/>
    <text x="311" y="258" font-size="10" fill="#ffffff" text-anchor="middle">Iniciar</text>
  </g>
  <g>
    <rect x="500" y="150" width="230" height="120" rx="6" fill="#f5f5f5" stroke="#cccccc"/>
    <rect x="516" y="166" width="28" height="28" fill="#d9d9d9"/>
    <text x="554" y="185" font-size="13" fill="#333333">Solicitud de Crédito</text>
    <text x="516" y="230" font-size="11" fill="#999999">Tarjeta: proceso iniciable</text>
    <rect x="516" y="242" width="90" height="24" rx="3" fill="#999999"/>
    <text x="561" y="258" font-size="10" fill="#ffffff" text-anchor="middle">Iniciar</text>
  </g>
  <g>
    <rect x="750" y="150" width="230" height="120" rx="6" fill="#f5f5f5" stroke="#cccccc"/>
    <rect x="766" y="166" width="28" height="28" fill="#d9d9d9"/>
    <text x="804" y="185" font-size="13" fill="#333333">Solicitud de Vacaciones</text>
    <text x="766" y="230" font-size="11" fill="#999999">Tarjeta: proceso iniciable</text>
    <rect x="766" y="242" width="90" height="24" rx="3" fill="#999999"/>
    <text x="811" y="258" font-size="10" fill="#ffffff" text-anchor="middle">Iniciar</text>
  </g>
  <g>
    <rect x="1000" y="150" width="230" height="120" rx="6" fill="#f5f5f5" stroke="#cccccc"/>
    <rect x="1016" y="166" width="28" height="28" fill="#d9d9d9"/>
    <text x="1054" y="185" font-size="13" fill="#333333">Otro proceso disponible</text>
    <text x="1016" y="230" font-size="11" fill="#999999">Tarjeta: proceso iniciable</text>
    <rect x="1016" y="242" width="90" height="24" rx="3" fill="#999999"/>
    <text x="1061" y="258" font-size="10" fill="#ffffff" text-anchor="middle">Iniciar</text>
  </g>

  <text x="250" y="310" font-size="11" fill="#999999">Nota: el listado de procesos disponibles lo determina la API de BAW según el usuario autenticado</text>
</svg>
