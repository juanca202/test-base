<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="800" fill="#ffffff"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="800" fill="#4d4d4d"/>
  <text x="20" y="40" font-size="14" fill="#ffffff">Usuario autenticado</text>
  <text x="20" y="110" font-size="14" fill="#cccccc">Iniciar</text>
  <text x="20" y="160" font-size="14" fill="#cccccc">Mis tareas</text>
  <text x="20" y="200" font-size="14" fill="#cccccc">Procesos</text>
  <text x="20" y="240" font-size="14" fill="#cccccc">Rendimiento del proceso</text>
  <rect x="0" y="265" width="220" height="34" fill="#666666"/>
  <text x="20" y="287" font-size="14" fill="#ffffff">Rendimiento del equipo</text>

  <!-- Top bar -->
  <rect x="220" y="0" width="1060" height="70" fill="#e6e6e6"/>
  <text x="250" y="42" font-size="20" fill="#333333">Rendimiento del equipo</text>

  <!-- Cards grid: groups -->
  <g>
    <rect x="250" y="100" width="300" height="130" rx="6" fill="#f5f5f5" stroke="#cccccc"/>
    <circle cx="300" cy="160" r="28" fill="none" stroke="#999999" stroke-width="8"/>
    <text x="345" y="150" font-size="13" fill="#333333">Analistas Proveedores</text>
    <text x="345" y="168" font-size="10" fill="#999999">0 vencido · 0 en riesgo · 0 a tiempo</text>
    <text x="265" y="205" font-size="10" fill="#999999">Descripción breve del grupo</text>
  </g>
  <g>
    <rect x="570" y="100" width="300" height="130" rx="6" fill="#f5f5f5" stroke="#cccccc"/>
    <circle cx="620" cy="160" r="28" fill="none" stroke="#999999" stroke-width="8"/>
    <text x="665" y="150" font-size="13" fill="#333333">General Managers</text>
    <text x="665" y="168" font-size="10" fill="#999999">0 vencido · 0 en riesgo · 0 a tiempo</text>
    <text x="585" y="205" font-size="10" fill="#999999">Descripción breve del grupo</text>
  </g>
  <g>
    <rect x="890" y="100" width="300" height="130" rx="6" fill="#f5f5f5" stroke="#cccccc"/>
    <circle cx="940" cy="160" r="28" fill="none" stroke="#999999" stroke-width="8"/>
    <text x="985" y="150" font-size="13" fill="#333333">Human Resources</text>
    <text x="985" y="168" font-size="10" fill="#999999">1 vencido · 2 en riesgo · 5 a tiempo</text>
    <text x="905" y="205" font-size="10" fill="#999999">Descripción breve del grupo</text>
  </g>

  <text x="250" y="270" font-size="11" fill="#999999">Tarjeta: los grupos y sus totales dependen de lo que retorne la API de BAW</text>
</svg>
