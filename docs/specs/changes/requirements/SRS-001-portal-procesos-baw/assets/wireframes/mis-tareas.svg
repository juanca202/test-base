<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="800" fill="#ffffff"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="800" fill="#4d4d4d"/>
  <text x="20" y="40" font-size="14" fill="#ffffff">Usuario autenticado</text>
  <text x="20" y="110" font-size="14" fill="#cccccc">Iniciar</text>
  <rect x="0" y="135" width="220" height="34" fill="#666666"/>
  <text x="20" y="157" font-size="14" fill="#ffffff">Mis tareas</text>
  <text x="20" y="200" font-size="14" fill="#cccccc">Procesos</text>
  <text x="20" y="240" font-size="14" fill="#cccccc">Rendimiento del proceso</text>
  <text x="20" y="280" font-size="14" fill="#cccccc">Rendimiento del equipo</text>

  <!-- Top bar -->
  <rect x="220" y="0" width="1060" height="70" fill="#e6e6e6"/>
  <text x="250" y="42" font-size="20" fill="#333333">Mis tareas</text>

  <!-- Summary counters -->
  <rect x="900" y="15" width="90" height="40" rx="4" fill="#e0e0e0"/>
  <text x="945" y="30" font-size="10" fill="#666666" text-anchor="middle">Total</text>
  <text x="945" y="48" font-size="16" fill="#333333" text-anchor="middle">12</text>

  <rect x="1000" y="15" width="90" height="40" rx="4" fill="#e0e0e0"/>
  <text x="1045" y="30" font-size="10" fill="#666666" text-anchor="middle">A tiempo</text>
  <text x="1045" y="48" font-size="16" fill="#333333" text-anchor="middle">8</text>

  <rect x="1100" y="15" width="90" height="40" rx="4" fill="#e0e0e0"/>
  <text x="1145" y="30" font-size="10" fill="#666666" text-anchor="middle">En riesgo</text>
  <text x="1145" y="48" font-size="16" fill="#333333" text-anchor="middle">3</text>

  <!-- Search / filters -->
  <rect x="250" y="90" width="600" height="36" rx="4" fill="#f5f5f5" stroke="#bbbbbb"/>
  <text x="262" y="113" font-size="12" fill="#999999">Campo: buscar por texto...</text>
  <rect x="870" y="90" width="150" height="36" rx="4" fill="#e6e6e6" stroke="#bbbbbb"/>
  <text x="945" y="113" font-size="12" fill="#666666" text-anchor="middle">Selector: filtros</text>

  <!-- Task rows -->
  <g>
    <rect x="250" y="145" width="980" height="70" fill="#ffffff" stroke="#dddddd"/>
    <rect x="262" y="163" width="10" height="34" fill="#b3261e" opacity="0.6"/>
    <text x="284" y="172" font-size="13" fill="#333333">Aprobar Crédito</text>
    <text x="284" y="190" font-size="11" fill="#666666">Solicitar Crédito:273 · Analistas</text>
    <text x="284" y="205" font-size="10" fill="#999999">Icono: reloj — Vencimiento: 8 sept 2026 16:45</text>
    <rect x="1080" y="168" width="100" height="24" rx="3" fill="#999999"/>
    <text x="1130" y="184" font-size="10" fill="#ffffff" text-anchor="middle">Abrir tarea</text>
  </g>
  <g>
    <rect x="250" y="215" width="980" height="70" fill="#f9f9f9" stroke="#dddddd"/>
    <rect x="262" y="233" width="10" height="34" fill="#d9a441" opacity="0.6"/>
    <text x="284" y="242" font-size="13" fill="#333333">Solicitar apertura de cuenta</text>
    <text x="284" y="260" font-size="11" fill="#666666">Apertura de Cuentas:254 · Ejecutivos de cuenta</text>
    <text x="284" y="275" font-size="10" fill="#999999">Icono: reloj — Vencimiento: 14 jul 2026 18:25</text>
    <rect x="1080" y="238" width="100" height="24" rx="3" fill="#999999"/>
    <text x="1130" y="254" font-size="10" fill="#ffffff" text-anchor="middle">Abrir tarea</text>
  </g>
  <g>
    <rect x="250" y="285" width="980" height="70" fill="#ffffff" stroke="#dddddd"/>
    <rect x="262" y="303" width="10" height="34" fill="#5c8a5c" opacity="0.6"/>
    <text x="284" y="312" font-size="13" fill="#333333">Revisar solicitud de vacaciones</text>
    <text x="284" y="330" font-size="11" fill="#666666">Vacation request:110 · Recursos Humanos</text>
    <text x="284" y="345" font-size="10" fill="#999999">Icono: reloj — Vencimiento: 20 sept 2026 09:00</text>
    <rect x="1080" y="308" width="100" height="24" rx="3" fill="#999999"/>
    <text x="1130" y="324" font-size="10" fill="#ffffff" text-anchor="middle">Abrir tarea</text>
  </g>

  <text x="250" y="400" font-size="11" fill="#999999">Nota: campos, conteos y orden dependen de lo que retorne la API de BAW para el usuario autenticado</text>
</svg>
