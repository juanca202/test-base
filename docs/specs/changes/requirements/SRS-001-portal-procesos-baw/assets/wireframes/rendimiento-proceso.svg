<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="800" fill="#ffffff"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="800" fill="#4d4d4d"/>
  <text x="20" y="40" font-size="14" fill="#ffffff">Usuario autenticado</text>
  <text x="20" y="110" font-size="14" fill="#cccccc">Iniciar</text>
  <text x="20" y="160" font-size="14" fill="#cccccc">Mis tareas</text>
  <text x="20" y="200" font-size="14" fill="#cccccc">Procesos</text>
  <rect x="0" y="225" width="220" height="34" fill="#666666"/>
  <text x="20" y="247" font-size="14" fill="#ffffff">Rendimiento del proceso</text>
  <text x="20" y="280" font-size="14" fill="#cccccc">Rendimiento del equipo</text>

  <!-- Top bar -->
  <rect x="220" y="0" width="1060" height="70" fill="#e6e6e6"/>
  <text x="250" y="42" font-size="20" fill="#333333">Rendimiento del proceso</text>

  <!-- Cards grid -->
  <g>
    <rect x="250" y="100" width="330" height="150" rx="6" fill="#f5f5f5" stroke="#cccccc"/>
    <circle cx="310" cy="175" r="35" fill="none" stroke="#999999" stroke-width="10"/>
    <text x="270" y="220" font-size="12" fill="#333333">CP01 — Calificación de Proveedores</text>
    <text x="270" y="238" font-size="10" fill="#999999">0 vencido · 0 en riesgo · 0 a tiempo</text>
  </g>
  <g>
    <rect x="600" y="100" width="330" height="150" rx="6" fill="#f5f5f5" stroke="#cccccc"/>
    <circle cx="660" cy="175" r="35" fill="none" stroke="#999999" stroke-width="10"/>
    <text x="620" y="220" font-size="12" fill="#333333">Standard HR Open New Position</text>
    <text x="620" y="238" font-size="10" fill="#999999">0 vencido · 0 en riesgo · 0 a tiempo</text>
  </g>
  <g>
    <rect x="950" y="100" width="280" height="150" rx="6" fill="#f5f5f5" stroke="#cccccc"/>
    <circle cx="1000" cy="175" r="35" fill="none" stroke="#999999" stroke-width="10"/>
    <text x="960" y="220" font-size="12" fill="#333333">Solicitud de Crédito</text>
    <text x="960" y="238" font-size="10" fill="#999999">1 vencido · 0 en riesgo · 4 a tiempo</text>
  </g>

  <text x="250" y="290" font-size="11" fill="#999999">Tarjeta: seleccionar un proceso abre su detalle (estadísticas + diagrama) — ver tarea-detalle de "Rendimiento del proceso"</text>
</svg>
