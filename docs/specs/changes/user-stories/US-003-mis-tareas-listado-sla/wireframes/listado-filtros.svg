<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="800" fill="#ffffff"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="800" fill="#4d4d4d"/>
  <text x="20" y="40" font-size="14" fill="#ffffff">Usuario autenticado</text>
  <text x="20" y="110" font-size="14" fill="#cccccc">Iniciar</text>
  <rect x="0" y="135" width="220" height="34" fill="#666666"/>
  <text x="20" y="157" font-size="14" fill="#ffffff">Mis tareas</text>
  <text x="20" y="200" font-size="14" fill="#cccccc">Procesos</text>
  <text x="20" y="240" font-size="14" fill="#cccccc">Rendimiento del proceso</text>
  <text x="20" y="280" font-size="14" fill="#cccccc">Rendimiento del equipo</text>

  <!-- Top bar -->
  <rect x="220" y="0" width="1060" height="70" fill="#e6e6e6"/>
  <text x="250" y="42" font-size="20" fill="#333333">Mis tareas</text>

  <!-- Summary counters reflect only the loaded page, unaffected by server filters note -->
  <rect x="800" y="15" width="90" height="40" rx="4" fill="#e0e0e0"/>
  <text x="845" y="30" font-size="10" fill="#666666" text-anchor="middle">Total</text>
  <text x="845" y="48" font-size="16" fill="#333333" text-anchor="middle">6</text>

  <rect x="900" y="15" width="90" height="40" rx="4" fill="#e0e0e0"/>
  <text x="945" y="30" font-size="10" fill="#666666" text-anchor="middle">A tiempo</text>
  <text x="945" y="48" font-size="16" fill="#5c8a5c" text-anchor="middle">1</text>

  <rect x="1000" y="15" width="90" height="40" rx="4" fill="#e0e0e0"/>
  <text x="1045" y="30" font-size="10" fill="#666666" text-anchor="middle">En riesgo</text>
  <text x="1045" y="48" font-size="16" fill="#d9a441" text-anchor="middle">2</text>

  <rect x="1100" y="15" width="90" height="40" rx="4" fill="#e0e0e0"/>
  <text x="1145" y="30" font-size="10" fill="#666666" text-anchor="middle">Vencidas</text>
  <text x="1145" y="48" font-size="16" fill="#b3261e" text-anchor="middle">3</text>

  <!-- Search with active text (client-side, AC-003) -->
  <rect x="250" y="90" width="450" height="36" rx="4" fill="#ffffff" stroke="#4d4d4d" stroke-width="2"/>
  <text x="262" y="113" font-size="12" fill="#333333">crédito</text>
  <text x="670" y="113" font-size="12" fill="#999999">✕</text>

  <!-- Estado dropdown open (server filter, AC-003) -->
  <rect x="710" y="90" width="130" height="36" rx="4" fill="#ffffff" stroke="#4d4d4d" stroke-width="2"/>
  <text x="775" y="113" font-size="11" fill="#333333" text-anchor="middle">Estado ▾</text>
  <rect x="710" y="126" width="150" height="96" fill="#ffffff" stroke="#bbbbbb"/>
  <text x="722" y="146" font-size="11" fill="#333333">☑ Recibida</text>
  <text x="722" y="166" font-size="11" fill="#333333">☐ Reclamada</text>
  <text x="722" y="186" font-size="11" fill="#333333">☐ En progreso</text>
  <text x="722" y="206" font-size="11" fill="#333333">☐ Completada</text>

  <rect x="850" y="90" width="130" height="36" rx="4" fill="#e6e6e6" stroke="#bbbbbb"/>
  <text x="915" y="113" font-size="11" fill="#666666" text-anchor="middle">Modelo: Todos</text>
  <rect x="990" y="90" width="130" height="36" rx="4" fill="#e6e6e6" stroke="#bbbbbb"/>
  <text x="1055" y="113" font-size="11" fill="#666666" text-anchor="middle">Instancia: Todas</text>

  <!-- Active filter chips -->
  <rect x="250" y="235" width="150" height="26" rx="13" fill="#e6e6e6"/>
  <text x="262" y="252" font-size="11" fill="#333333">Texto: "crédito" ✕</text>
  <rect x="410" y="235" width="140" height="26" rx="13" fill="#e6e6e6"/>
  <text x="422" y="252" font-size="11" fill="#333333">Estado: Recibida ✕</text>

  <!-- Column headers -->
  <text x="284" y="282" font-size="10" fill="#999999">TAREA / PROCESO</text>
  <text x="790" y="282" font-size="10" fill="#999999">VENCIMIENTO</text>
  <text x="1081" y="282" font-size="10" fill="#999999" text-anchor="middle">ACCIONES</text>

  <!-- Filtered result rows (only matches remain), con acciones: editar, historial, ver flujo, ver instancia, ejecutar -->
  <g>
    <rect x="250" y="290" width="980" height="60" fill="#ffffff" stroke="#dddddd"/>
    <rect x="262" y="303" width="10" height="34" fill="#5c8a5c"/>
    <text x="284" y="312" font-size="13" fill="#333333">Aprobar <tspan font-weight="bold">Crédito</tspan></text>
    <text x="284" y="330" font-size="11" fill="#666666">Solicitar Crédito:273 · Analistas · Recibida</text>
    <text x="790" y="312" font-size="11" fill="#666666">Vence: 8 sept 2026</text>
    <text x="790" y="328" font-size="11" fill="#666666">16:45 · A tiempo</text>
    <rect x="940" y="308" width="54" height="24" rx="3" fill="#e6e6e6" stroke="#bbbbbb"/>
    <text x="967" y="324" font-size="6.5" fill="#333333" text-anchor="middle">Editar</text>
    <rect x="997" y="308" width="54" height="24" rx="3" fill="#e6e6e6" stroke="#bbbbbb"/>
    <text x="1024" y="324" font-size="6.5" fill="#333333" text-anchor="middle">Historial</text>
    <rect x="1054" y="308" width="54" height="24" rx="3" fill="#e6e6e6" stroke="#bbbbbb"/>
    <text x="1081" y="324" font-size="6.5" fill="#333333" text-anchor="middle">Ver flujo</text>
    <rect x="1111" y="308" width="54" height="24" rx="3" fill="#e6e6e6" stroke="#bbbbbb"/>
    <text x="1138" y="324" font-size="6.5" fill="#333333" text-anchor="middle">Ver instancia</text>
    <rect x="1168" y="308" width="54" height="24" rx="3" fill="#999999"/>
    <text x="1195" y="324" font-size="6.5" fill="#ffffff" text-anchor="middle">Ejecutar</text>
  </g>

  <text x="250" y="385" font-size="11" fill="#999999">Nota: el selector de Estado/Modelo/Instancia consulta de nuevo al servidor (paginación reinicia);</text>
  <text x="250" y="402" font-size="11" fill="#999999">el campo de texto libre solo filtra las filas ya cargadas en la página actual (AC-003).</text>
</svg>
